<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Victor David Medina applied AI systems banner</title>
  <desc id="desc">A warm RelayLaunch-style banner showing a four-agent AI coding harness, owner approval gates, and production reliability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1917"/>
      <stop offset="58%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#44403C"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="20%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.42"/>
      <stop offset="62%" stop-color="#D97706" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="82%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.36"/>
      <stop offset="72%" stop-color="#0D9488" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#78716C" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#amberGlow)"/>
  <rect width="1280" height="420" fill="url(#tealGlow)"/>
  <rect x="22" y="22" width="1236" height="376" rx="30" fill="none" stroke="#A8A29E" stroke-opacity="0.22"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(72 68)">
      <rect x="0" y="0" width="252" height="34" rx="17" fill="#D97706" fill-opacity="0.16" stroke="#F59E0B" stroke-opacity="0.58"/>
      <text x="126" y="23" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.8" fill="#FCD34D">APPLIED AI ENGINEER</text>

      <text x="0" y="100" font-size="62" font-weight="800" fill="#F5F5F4">Victor David Medina</text>
      <text x="2" y="145" font-size="25" font-weight="700" fill="#FBBF24">Forward-deployed systems, owner approval gates, reliable AI ops</text>
      <text x="2" y="186" font-size="18" fill="#D6D3D1">I build the model gateway, the eval harness, the workflow, and the guardrails.</text>

      <g transform="translate(0 226)">
        <rect x="0" y="0" width="158" height="42" rx="21" fill="#292524" stroke="#78716C" stroke-opacity="0.55"/>
        <text x="79" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F5F4">LiteLLM</text>
        <rect x="176" y="0" width="154" height="42" rx="21" fill="#292524" stroke="#78716C" stroke-opacity="0.55"/>
        <text x="253" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F5F4">RAG + evals</text>
        <rect x="348" y="0" width="192" height="42" rx="21" fill="#292524" stroke="#78716C" stroke-opacity="0.55"/>
        <text x="444" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F5F4">Cloudflare Workers</text>
      </g>
    </g>

    <g transform="translate(744 68)">
      <rect x="0" y="0" width="438" height="284" rx="24" fill="#1C1917" fill-opacity="0.76" stroke="#A8A29E" stroke-opacity="0.28"/>
      <text x="34" y="48" font-size="16" font-weight="800" letter-spacing="2.2" fill="#F59E0B">FOUR AGENTS, ONE WORKFLOW</text>

      <g fill="none" stroke="#F59E0B" stroke-opacity="0.66" stroke-width="2">
        <path d="M112 96 H326"/>
        <path d="M112 174 H326"/>
        <path d="M220 96 V220"/>
      </g>

      <g>
        <rect x="34" y="74" width="156" height="46" rx="14" fill="#292524" stroke="#D97706" stroke-opacity="0.70"/>
        <text x="112" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F5F4">Claude Code</text>
        <rect x="248" y="74" width="156" height="46" rx="14" fill="#292524" stroke="#D97706" stroke-opacity="0.70"/>
        <text x="326" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F5F4">Copilot</text>
        <rect x="34" y="152" width="156" height="46" rx="14" fill="#292524" stroke="#0D9488" stroke-opacity="0.70"/>
        <text x="112" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F5F4">Gemini CLI</text>
        <rect x="248" y="152" width="156" height="46" rx="14" fill="#292524" stroke="#0D9488" stroke-opacity="0.70"/>
        <text x="326" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#F5F5F4">Codex</text>
      </g>

      <rect x="82" y="232" width="274" height="38" rx="19" fill="#D97706"/>
      <text x="219" y="257" text-anchor="middle" font-size="14" font-weight="800" fill="#F5F5F4">trust-but-verify gate before ship</text>
    </g>

    <circle cx="1146" cy="79" r="9" fill="#F59E0B"/>
    <circle cx="1174" cy="79" r="9" fill="#0D9488"/>
    <circle cx="1202" cy="79" r="9" fill="#8B5CF6"/>
  </g>
</svg>
